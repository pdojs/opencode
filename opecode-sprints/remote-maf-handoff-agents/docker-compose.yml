# WS5 (compose-dev-env): local dev environment for the remote MAF handoff-bridge PoC.
#
# Starts:
#   - bridge   — the WS1 FastAPI/WebSocket handoff-bridge container, exposing
#                GET /agents/manifest and WS /agents/{id}/session on :8000. The bridge app
#                lives in its own repo, expected checked out beside this one as
#                ../remote-maf-handoff-agents (see BRIDGE_CONTEXT below).
#   - phoenix  — a local Arize Phoenix instance (official published image, SQLite-backed,
#                no Postgres needed for this PoC) receiving OTel traces from `bridge` over
#                OTLP/gRPC and exposing its UI on :6006.
#
# Usage (from the repo root):
#   export OPENAI_API_KEY=sk-...          # required: app/orchestrator.py's sample agents are
#                                          # OpenAI-backed (see the note below on non-GitHub
#                                          # LLM endpoints for MAF agents)
#   docker compose -f opecode-sprints/remote-maf-handoff-agents/docker-compose.yml up --build
#   curl localhost:8000/agents/manifest   # should return the "support" orchestrator manifest
#   open http://localhost:6006            # Phoenix UI
#
# See VERIFY.md in this folder for the full manual end-to-end demo script (Demos 1-3 from
# test-requirements.md) that exercises this environment against a real local OpenCode + a real
# local workspace directory.
#
# Note on LLM endpoints: the bridge's sample agents (app/orchestrator.py) call OpenAI's API
# directly via OPENAI_API_KEY — they do NOT use whatever LLM endpoint the OpenCode harness
# itself is configured with (e.g. a GitHub Copilot-backed model). This is intentional: a MAF
# orchestrator is an independent agent host and may be backed by any provider (OpenAI, Claude,
# Azure OpenAI, etc.) unrelated to the harness's own model config. Swap the env vars below
# (and orchestrator.py's OpenAIChatClient() construction) if you want to point the sample
# agents at Azure OpenAI or another OpenAI-compatible endpoint instead.

services:
  bridge:
    build:
      # Defaults to a sibling checkout of the bridge repo; override BRIDGE_CONTEXT to point
      # somewhere else. Resolved relative to this file: ../../.. is the directory holding the
      # opencode checkout.
      context: ${BRIDGE_CONTEXT:-../../../remote-maf-handoff-agents}
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY to run the bridge's sample agents}
      # Cheap default so demo runs stay low-cost; override with a pricier model if needed.
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
      - OTEL_SERVICE_NAME=remote-maf-handoff-bridge
      # Agent Framework emits only metadata (token counts, durations, operation names) unless
      # this is set: prompts, completions, tool arguments and tool results are all gated behind
      # it (ObservabilitySettings.enable_sensitive_data defaults to False). Without it Phoenix
      # shows the trace tree but every message pane is empty.
      #
      # Defaults to OFF: turning it on exports raw conversation content to the collector,
      # including whatever an agent reads out of your local workspace via run_local_command.
      # Opt in per-run when you are debugging a demo and the collector is a Phoenix on
      # localhost that you control:
      #
      #   ENABLE_SENSITIVE_DATA=true docker compose -f ... up -d bridge
      #
      # Never enable it against a shared or hosted backend.
      - ENABLE_SENSITIVE_DATA=${ENABLE_SENSITIVE_DATA:-false}
      - MAF_CHECKPOINT_DIR=/data/checkpoints
      - MAF_SESSION_DIR=/data/sessions
    volumes:
      # Conversation checkpoints, so rejoining a session works across a container restart and
      # not just across a reconnect.
      - bridge-checkpoints:/data/checkpoints
      # Solo (single-agent) conversations, which persist an AgentSession rather than a workflow
      # checkpoint.
      - bridge-sessions:/data/sessions
    depends_on:
      - phoenix
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/agents/manifest')"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006" # Phoenix UI + HTTP OTLP
      - "4317:4317" # OTLP gRPC collector (used by the bridge's telemetry.py)

volumes:
  bridge-checkpoints:
  bridge-sessions:
